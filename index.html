
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTRON Clothing Store</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:white;padding:22px;text-align:center}
header h1{margin:0;color:#39e6b0}
header p{margin-bottom:0}
h2{text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:12px;overflow:hidden;padding-bottom:12px;box-shadow:0 2px 8px #ddd}
.photo{height:130px;background:#e9e9e9;display:flex;align-items:center;justify-content:center;font-size:65px}
.card h3{font-size:16px;margin:12px 10px 5px}
.price{font-size:20px;font-weight:bold;margin:8px 10px}
button{margin:5px 10px;width:calc(100% - 20px);padding:12px 4px;border:0;border-radius:7px;background:#111;color:white;font-weight:bold}
.note{text-align:center;font-size:12px;color:#666;padding:20px}
</style>
</head>
<body>
<header>
<h1>ALTRON.</h1>
<p>Simple Look. Strong Style.</p>
<p>Choose your style. Order on WhatsApp.</p>
</header>
<h2>Our Products</h2>
<div class="products">
<div class="card">
<div class="photo">👕</div>
<h3>Black T-Shirt</h3>
<div class="price">₹299</div>
<button onclick="order('Black T-Shirt',299)">Order on WhatsApp</button>
</div>
<div class="card">
<div class="photo">👕</div>
<h3>White T-Shirt</h3>
<div class="price">₹249</div>
<button onclick="order('White T-Shirt',249)">Order on WhatsApp</button>
</div>
<div class="card">
<div class="photo">🧥</div>
<h3>Hoodie</h3>
<div class="price">₹599</div>
<button onclick="order('Hoodie',599)">Order on WhatsApp</button>
</div>
</div>
<p class="note">Prices are in INR. Confirm size and delivery before ordering.</p>
<script>
function order(product,price){
const phone="91YOURNUMBER";
const message="Hello ALTRON! I want to order "+product+" for ₹"+price+". Please tell me available sizes and delivery details.";
if(phone==="91YOURNUMBER"){
alert("WhatsApp number abhi set nahi hua hai. Shop owner ko contact karein.");
return;
}
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message),"_blank");
}
</script>
</body>
</html>
